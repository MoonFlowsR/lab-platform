<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <script>
      // Apply the browser's choice before styles or the app can paint.
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("platform:theme");
          if (["light", "dark", "system"].includes(saved)) preference = saved;
        } catch { /* Use the system preference when browser storage is unavailable. */ }
        const theme = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0b1220" : "#f4f6fa";
      })();
    </script>
    <title>实验室管理平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
